kind = "web"
previewPath = "/"
title = "Tracking Website"
version = "1.0.0"
id = "artifacts/tracking-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22347

[services.development]
run = "pnpm --filter @workspace/tracking-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tracking-website", "run", "build" ]
publicDir = "artifacts/tracking-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22347"
BASE_PATH = "/"
